name: Gerar Radares Jurídicos
on:
  workflow_dispatch:
    inputs:
      etapa:
        description: O que rodar nesta execucao
        required: false
        type: choice
        default: coleta
        options:
          - coleta
          - cobertura
          - ambas
          - comparar_extracao
          - alternativas
      fontes_cobertura:
        description: Fontes a conferir na cobertura (vazio = todas)
        required: false
        type: string
        default: ""
      urls_candidatas:
        description: URLs candidatas a testar na cobertura
        required: false
        type: string
        default: ""
      executar_teste_dou:
        description: Executar prova de conceito do DOU Regulatório
        required: true
        type: boolean
        default: true
      dou_data:
        description: Data do DOU em DD-MM-AAAA
        required: true
        type: string
        default: "24-08-2026"
permissions:
  contents: write
concurrency:
  group: gerar-radares-juridicos
  cancel-in-progress: false
jobs:
  gerar:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: "3.11", cache: pip}
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Validar arquivos
        run: |
          python -m json.tool fontes.json > /dev/null
          python -m py_compile scripts/gerar_boletim.py scripts/gerar_html.py scripts/gerar_auditoria_html.py scripts/testar_dou_regulatorio.py scripts/gerar_boletim_final.py scripts/testar_decisoes_portal.py scripts/templates_radar.py scripts/inspecionar_templates.py scripts/conferir_cobertura.py scripts/diagnostico_funil.py scripts/testar_coleta.py scripts/investigar_alternativas.py
      - name: Testar a coleta
        run: python scripts/testar_coleta.py
      - name: Conferir cobertura das fontes
        if: ${{ inputs.etapa == 'cobertura' || inputs.etapa == 'ambas' }}
        env:
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
        run: |
          argumentos=""
          if [ -n "${{ inputs.fontes_cobertura }}" ]; then
            argumentos="$argumentos --fonte ${{ inputs.fontes_cobertura }}"
          fi
          if [ -n "${{ inputs.urls_candidatas }}" ]; then
            argumentos="$argumentos --testar-url ${{ inputs.urls_candidatas }}"
          fi
          python scripts/conferir_cobertura.py --dias 2 --json output/cobertura.json $argumentos

      - name: Comparar as duas formas de extracao
        if: ${{ inputs.etapa == 'comparar_extracao' }}
        env:
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
        run: |
          python scripts/comparar_extracao.py --dias 1 --fonte ${{ inputs.fontes_cobertura }}

      - name: Investigar coleta sem Firecrawl
        # Download direto, RSS, API publica e busca por data no site. Nao
        # recebe chave nenhuma: nao ha como gastar credito nesta etapa.
        if: ${{ inputs.etapa == 'alternativas' }}
        run: |
          python scripts/investigar_alternativas.py --autoteste
          argumentos=""
          if [ -n "${{ inputs.fontes_cobertura }}" ]; then
            argumentos="--fonte ${{ inputs.fontes_cobertura }}"
          fi
          python scripts/investigar_alternativas.py --json output/alternativas.json $argumentos

      - name: Registrar o resultado da investigacao
        if: ${{ always() && inputs.etapa == 'alternativas' }}
        run: |
          if [ ! -f output/alternativas.json ]; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f output/alternativas.json
          if git diff --staged --quiet; then exit 0; fi
          git commit -m "Registra a investigacao de coleta sem Firecrawl"
          git pull --rebase origin "${{ github.ref_name }}"
          git push origin "HEAD:${{ github.ref_name }}"

      - name: Mostrar o detalhe da cobertura
        if: ${{ always() && inputs.etapa != 'coleta' }}
        run: |
          if [ -f output/cobertura.json ]; then
            python -m json.tool output/cobertura.json
          fi

      - name: Gerar Radares
        if: ${{ inputs.etapa == 'coleta' || inputs.etapa == 'ambas' }}
        env:
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python scripts/gerar_boletim.py
          python scripts/gerar_html.py
          python scripts/gerar_auditoria_html.py
      - name: Testar DOU
        # So nas etapas que geram Radares: as de medicao nao gastam credito
        # com a prova de conceito do DOU.
        if: ${{ inputs.executar_teste_dou && (inputs.etapa == 'coleta' || inputs.etapa == 'ambas') }}
        env:
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DOU_DATA: ${{ inputs.dou_data }}
        run: python scripts/testar_dou_regulatorio.py
      - uses: actions/upload-artifact@v4
        if: ${{ always() && inputs.etapa != 'coleta' }}
        with:
          name: cobertura-${{ github.run_number }}
          retention-days: 14
          if-no-files-found: warn
          path: output/cobertura.json

      - uses: actions/upload-artifact@v4
        if: ${{ inputs.etapa == 'coleta' || inputs.etapa == 'ambas' }}
        with:
          name: radares-validacao-${{ github.run_number }}
          retention-days: 14
          if-no-files-found: error
          path: |
            output/boletim.json
            output/log_execucao.json
            output/auditoria.html
            output/validacao_*.html
      - uses: actions/upload-artifact@v4
        if: ${{ inputs.executar_teste_dou }}
        with:
          name: teste-dou-regulatorio-${{ github.run_number }}
          retention-days: 14
          path: |
            output/teste_dou_regulatorio.json
            output/teste_dou_regulatorio.html
      - name: Commit oficial
        if: ${{ inputs.etapa == 'coleta' || inputs.etapa == 'ambas' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output/boletim.json output/log_execucao.json output/auditoria.html output/validacao_*.html
          if git diff --staged --quiet; then exit 0; fi
          git commit -m "Atualiza Radares - $(date +'%Y-%m-%d')"
          git push
