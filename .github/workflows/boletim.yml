name: Gerar Radares Jurídicos
on:
  workflow_dispatch:
    inputs:
      etapa:
        description: O que rodar nesta execucao
        required: false
        type: choice
        default: coleta
        options:
          - coleta
          - cobertura
          - ambas
          - comparar_extracao
          - alternativas
          - reprocessar
          - sondar
          - demo_dou
          - investigar_dou
          - ensaio_dou
      fontes_cobertura:
        description: Fontes a conferir na cobertura (vazio = todas)
        required: false
        type: string
        default: ""
      urls_candidatas:
        description: URLs candidatas a testar na cobertura
        required: false
        type: string
        default: ""
      executar_teste_dou:
        description: Executar prova de conceito do DOU Regulatório (gasta 1 crédito do Firecrawl e uma chamada ao Gemini)
        required: true
        type: boolean
        default: false
      dou_data:
        description: Data do DOU em DD-MM-AAAA
        required: true
        type: string
        default: "24-08-2026"
permissions:
  contents: write
concurrency:
  group: gerar-radares-juridicos
  cancel-in-progress: false
jobs:
  gerar:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # Sem isso o Python guarda a saida e o log so aparece no fim do passo:
      # em 01/10 o passo ficou 58 minutos sem uma linha ate ser cancelado.
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: "3.11", cache: pip}
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Validar arquivos
        run: |
          python -m json.tool fontes.json > /dev/null
          python -m py_compile scripts/coleta_direta.py scripts/sugestao_sem_ia.py scripts/gerar_boletim.py scripts/gerar_html.py scripts/gerar_auditoria_html.py scripts/testar_dou_regulatorio.py scripts/gerar_boletim_final.py scripts/testar_decisoes_portal.py scripts/templates_radar.py scripts/inspecionar_templates.py scripts/conferir_cobertura.py scripts/diagnostico_funil.py scripts/testar_coleta.py scripts/investigar_alternativas.py scripts/investigar_dou.py scripts/coleta_dou.py scripts/testar_dou.py
      - name: Testar a coleta
        run: |
          python scripts/testar_coleta.py
          python scripts/testar_dou.py
          python scripts/testar_publicacao.py
      - name: Conferir cobertura das fontes
        if: ${{ inputs.etapa == 'cobertura' || inputs.etapa == 'ambas' }}
        env:
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
        run: |
          argumentos=""
          if [ -n "${{ inputs.fontes_cobertura }}" ]; then
            argumentos="$argumentos --fonte ${{ inputs.fontes_cobertura }}"
          fi
          if [ -n "${{ inputs.urls_candidatas }}" ]; then
            argumentos="$argumentos --testar-url ${{ inputs.urls_candidatas }}"
          fi
          python scripts/conferir_cobertura.py --dias 2 --json output/cobertura.json $argumentos

      - name: Comparar as duas formas de extracao
        if: ${{ inputs.etapa == 'comparar_extracao' }}
        env:
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
        run: |
          python scripts/comparar_extracao.py --dias 1 --fonte ${{ inputs.fontes_cobertura }}

      - name: Investigar coleta sem Firecrawl
        # Download direto, RSS, API publica e busca por data no site. Nao
        # recebe chave nenhuma: nao ha como gastar credito nesta etapa.
        if: ${{ inputs.etapa == 'alternativas' || inputs.etapa == 'sondar' }}
        run: |
          python scripts/investigar_alternativas.py --autoteste
          if [ "${{ inputs.etapa }}" = "sondar" ]; then
            alvo="${{ inputs.fontes_cobertura }}"
            export ENSAIO_FONTE="${{ inputs.urls_candidatas }}"
            python scripts/investigar_alternativas.py --sondar-alvo "${alvo:-final}" --json output/alternativas_sonda.json
            exit 0
          fi
          argumentos=""
          if [ -n "${{ inputs.fontes_cobertura }}" ]; then
            argumentos="--fonte ${{ inputs.fontes_cobertura }}"
          fi
          python scripts/investigar_alternativas.py --json output/alternativas.json $argumentos

      - name: Registrar o resultado da investigacao
        if: ${{ always() && (inputs.etapa == 'alternativas' || inputs.etapa == 'sondar') }}
        run: bash scripts/publicar_saidas.sh "Registra a investigacao de coleta sem Firecrawl" "${{ github.ref_name }}" output/alternativas.json output/alternativas_sonda.json

      - name: Demonstracao do DOU em quatro modelos
        # So demonstracao: grava em output/demo_dou e nao commita nada. Baixa o
        # DOU pelo INLABS, o servico oficial da Imprensa Nacional, porque o
        # in.gov.br derruba a conexao vinda do runner. Nao recebe a chave do
        # Firecrawl nem a do Gemini.
        if: ${{ inputs.etapa == 'demo_dou' }}
        env:
          INLABS_EMAIL: ${{ secrets.INLABS_EMAIL }}
          INLABS_SENHA: ${{ secrets.INLABS_SENHA }}
        run: |
          pip install pypdf
          python scripts/demo_dou.py --autoteste
          python scripts/demo_dou.py --origem inlabs --data "${{ inputs.dou_data }}"

      - name: Investigar o DOU pela leitura do jornal
        # Baixa as Secoes 1 e 3 do dia em dou_data pelo Firecrawl, em HTML
        # bruto, e mede o que vem embutido. Gasta poucos creditos (uma
        # pagina por secao, a busca do in.gov.br para o total e um ato de
        # exemplo por secao). Nao recebe a chave do Gemini.
        if: ${{ inputs.etapa == 'investigar_dou' }}
        env:
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
        # Opcoes extras (--sem-busca, --varios-atos, --amostra DATAS) vem em urls_candidatas.
        run: |
          python scripts/investigar_dou.py --data "${{ inputs.dou_data }}" --secoes dou1 dou3 ${{ inputs.urls_candidatas }}
          if [ -d output/investigacao_dou/amostra ]; then
            bash scripts/publicar_saidas.sh "Registra a amostra do DOU" "${{ github.ref_name }}" output/investigacao_dou/amostra
          fi

      - name: Ensaio da coleta do DOU
        # A coleta do DOU sozinha, para a edicao em dou_data: leitura das
        # Secoes 1 e 3, filtro por orgao e abertura dos atos que passam.
        # Gasta os creditos de um dia de coleta e grava o resultado no ramo.
        if: ${{ inputs.etapa == 'ensaio_dou' }}
        env:
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
        run: |
          python scripts/coleta_dou.py --data "${{ inputs.dou_data }}" --saida output/ensaio_dou
          bash scripts/publicar_saidas.sh "Registra o ensaio da coleta do DOU de ${{ inputs.dou_data }}" "${{ github.ref_name }}" output/ensaio_dou

      - uses: actions/upload-artifact@v4
        if: ${{ always() && inputs.etapa == 'investigar_dou' }}
        with:
          name: investigacao-dou-${{ github.run_number }}
          retention-days: 14
          if-no-files-found: warn
          path: output/investigacao_dou/

      - uses: actions/upload-artifact@v4
        if: ${{ always() && inputs.etapa == 'demo_dou' }}
        with:
          name: demo-dou-${{ github.run_number }}
          retention-days: 14
          if-no-files-found: warn
          path: output/demo_dou/

      - name: Mostrar o detalhe da cobertura
        if: ${{ always() && inputs.etapa != 'coleta' }}
        run: |
          if [ -f output/cobertura.json ]; then
            python -m json.tool output/cobertura.json
          fi

      - name: Gerar Radares
        if: ${{ inputs.etapa == 'coleta' || inputs.etapa == 'ambas' }}
        env:
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python scripts/gerar_boletim.py
          python scripts/gerar_html.py
          python scripts/gerar_auditoria_html.py
      - name: Guardar o dossier da coleta
        # Roda mesmo se a classificacao falhar: e nesse caso que o dossier
        # guardado permite reprocessar sem gastar Firecrawl de novo. O
        # boletim.json ja esta modificado e fica para o commit oficial; o
        # publicar_saidas.sh traz o ramo sem precisar dele commitado.
        if: ${{ always() && (inputs.etapa == 'coleta' || inputs.etapa == 'ambas') }}
        run: |
          if [ ! -f output/dossier/indice.json ]; then exit 0; fi
          bash scripts/publicar_saidas.sh "Guarda a coleta de $(date +'%Y-%m-%d')" "${{ github.ref_name }}" output/dossier output/log_execucao.json
      - name: Reprocessar o dossier guardado
        # Sem FIRECRAWL_API_KEY: o reprocessamento nao tem como gastar credito.
        if: ${{ inputs.etapa == 'reprocessar' }}
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python scripts/gerar_boletim.py --reprocessar
          python scripts/gerar_html.py
          python scripts/gerar_auditoria_html.py
      - name: Testar DOU
        # So nas etapas que geram Radares: as de medicao nao gastam credito
        # com a prova de conceito do DOU.
        if: ${{ inputs.executar_teste_dou && (inputs.etapa == 'coleta' || inputs.etapa == 'ambas') }}
        env:
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DOU_DATA: ${{ inputs.dou_data }}
        run: python scripts/testar_dou_regulatorio.py
      - uses: actions/upload-artifact@v4
        if: ${{ always() && inputs.etapa != 'coleta' }}
        with:
          name: cobertura-${{ github.run_number }}
          retention-days: 14
          if-no-files-found: warn
          path: output/cobertura.json

      - uses: actions/upload-artifact@v4
        # Mesmo se um passo anterior falhar: o que a execucao gerou fica
        # disponivel para baixar por 14 dias.
        if: ${{ always() && (inputs.etapa == 'coleta' || inputs.etapa == 'ambas' || inputs.etapa == 'reprocessar') }}
        with:
          name: radares-validacao-${{ github.run_number }}
          retention-days: 14
          if-no-files-found: error
          path: |
            output/boletim.json
            output/log_execucao.json
            output/auditoria.html
            output/validacao_*.html
      - uses: actions/upload-artifact@v4
        if: ${{ inputs.executar_teste_dou }}
        with:
          name: teste-dou-regulatorio-${{ github.run_number }}
          retention-days: 14
          path: |
            output/teste_dou_regulatorio.json
            output/teste_dou_regulatorio.html
      - name: Commit oficial
        if: ${{ inputs.etapa == 'coleta' || inputs.etapa == 'ambas' || inputs.etapa == 'reprocessar' }}
        run: |
          if [ "${{ inputs.etapa }}" = "reprocessar" ]; then
            mensagem="Reprocessa Radares - $(date +'%Y-%m-%d')"
          else
            mensagem="Atualiza Radares - $(date +'%Y-%m-%d')"
          fi
          bash scripts/publicar_saidas.sh "$mensagem" "${{ github.ref_name }}" output/boletim.json output/log_execucao.json output/auditoria.html output/validacao_*.html
