name: Gerar Radares Jurídicos
on:
  workflow_dispatch:
    inputs:
      executar_teste_dou:
        description: "Executar prova de conceito do DOU Regulatório"
        required: false
        default: true
        type: boolean
      data_dou_teste:
        description: "Data do DOU em DD-MM-AAAA"
        required: false
        default: "24-08-2026"
        type: string
permissions:
  contents: write
concurrency:
  group: gerar-radares-juridicos
  cancel-in-progress: false
jobs:
  gerar-radares:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Validar arquivos
        run: |
          python -m json.tool fontes.json > /dev/null
          python -m py_compile scripts/gerar_boletim.py
          python -m py_compile scripts/gerar_html.py
          python -m py_compile scripts/gerar_auditoria_html.py
          python -m py_compile scripts/testar_dou_regulatorio.py
      - name: Gerar curadoria
        env:
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/gerar_boletim.py
      - name: Gerar validações
        run: python scripts/gerar_html.py
      - name: Gerar auditoria
        run: python scripts/gerar_auditoria_html.py
      - name: Testar DOU Regulatório
        if: ${{ inputs.executar_teste_dou }}
        env:
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DOU_DATA: ${{ inputs.data_dou_teste }}
          DOU_SECAO: do1
        run: python scripts/testar_dou_regulatorio.py
      - name: Verificar saídas principais
        run: |
          test -f output/boletim.json
          test -f output/log_execucao.json
          test -f output/auditoria.html
          for slug in trabalhista-empresarial direito-tributario societario-ma mercado-capitais-fundos regulatorio-oleo-gas imobiliario-infraestrutura ambiental-esg propriedade-intelectual contencioso-civel; do
            test -f "output/validacao_${slug}.html"
          done
      - name: Verificar saída DOU
        if: ${{ inputs.executar_teste_dou }}
        run: |
          test -f output/teste_dou_regulatorio.json
          test -f output/teste_dou_regulatorio.html
      - name: Artifact principal
        uses: actions/upload-artifact@v4
        with:
          name: radares-validacao-${{ github.run_number }}
          retention-days: 14
          if-no-files-found: error
          path: |
            output/boletim.json
            output/log_execucao.json
            output/auditoria.html
            output/validacao_*.html
      - name: Artifact DOU
        if: ${{ inputs.executar_teste_dou }}
        uses: actions/upload-artifact@v4
        with:
          name: teste-dou-regulatorio-${{ github.run_number }}
          retention-days: 14
          if-no-files-found: error
          path: |
            output/teste_dou_regulatorio.json
            output/teste_dou_regulatorio.html
      - name: Commit dos resultados oficiais
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output/boletim.json output/log_execucao.json output/auditoria.html output/validacao_*.html
          if git diff --staged --quiet; then
            echo "Nenhuma alteração oficial."
            exit 0
          fi
          git commit -m "Atualiza curadoria e auditoria dos Radares - $(date +'%Y-%m-%d')"
          git push
