name: Gerar Radares Jurídicos
on:
  workflow_dispatch:
    inputs:
      executar_teste_dou:
        description: Executar prova de conceito do DOU Regulatório
        required: true
        type: boolean
        default: true
      dou_data:
        description: Data do DOU em DD-MM-AAAA
        required: true
        type: string
        default: "24-08-2026"
permissions:
  contents: write
concurrency:
  group: gerar-radares-juridicos
  cancel-in-progress: false
jobs:
  gerar:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: "3.11", cache: pip}
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Validar arquivos
        run: |
          python -m json.tool fontes.json > /dev/null
          python -m py_compile scripts/gerar_boletim.py scripts/gerar_html.py scripts/gerar_auditoria_html.py scripts/testar_dou_regulatorio.py
      - name: Gerar Radares
        env:
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python scripts/gerar_boletim.py
          python scripts/gerar_html.py
          python scripts/gerar_auditoria_html.py
      - name: Testar DOU
        if: ${{ inputs.executar_teste_dou }}
        env:
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DOU_DATA: ${{ inputs.dou_data }}
        run: python scripts/testar_dou_regulatorio.py
      - uses: actions/upload-artifact@v4
        with:
          name: radares-validacao-${{ github.run_number }}
          retention-days: 14
          if-no-files-found: error
          path: |
            output/boletim.json
            output/log_execucao.json
            output/auditoria.html
            output/validacao_*.html
      - uses: actions/upload-artifact@v4
        if: ${{ inputs.executar_teste_dou }}
        with:
          name: teste-dou-regulatorio-${{ github.run_number }}
          retention-days: 14
          path: |
            output/teste_dou_regulatorio.json
            output/teste_dou_regulatorio.html
      - name: Commit oficial
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output/boletim.json output/log_execucao.json output/auditoria.html output/validacao_*.html
          if git diff --staged --quiet; then exit 0; fi
          git commit -m "Atualiza Radares - $(date +'%Y-%m-%d')"
          git push
