name: Conferir cobertura das fontes

# Compara, fonte a fonte, as publicacoes visiveis na pagina oficial com as
# que chegaram ao output/boletim.json. Nao altera o pipeline nem commita:
# so le a fonte e imprime o resultado.
on:
  workflow_dispatch:
    inputs:
      fontes:
        description: Fontes a conferir, separadas por espaco (vazio = todas)
        required: false
        type: string
        default: ""
      dias:
        description: Dias da janela a considerar
        required: false
        type: string
        default: "1"
      testar_url:
        description: URLs candidatas a testar, separadas por espaco
        required: false
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: conferir-cobertura
  cancel-in-progress: false

jobs:
  conferir:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11", cache: pip}
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Conferir cobertura
        env:
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
        run: |
          argumentos=""
          if [ -n "${{ inputs.fontes }}" ]; then
            argumentos="$argumentos --fonte ${{ inputs.fontes }}"
          fi
          if [ -n "${{ inputs.testar_url }}" ]; then
            argumentos="$argumentos --testar-url ${{ inputs.testar_url }}"
          fi
          python scripts/conferir_cobertura.py \
            --dias "${{ inputs.dias }}" \
            --json output/cobertura.json \
            $argumentos

      - name: Mostrar o detalhe no log
        if: always()
        run: |
          if [ -f output/cobertura.json ]; then
            cat output/cobertura.json
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cobertura-${{ github.run_number }}
          retention-days: 14
          if-no-files-found: warn
          path: output/cobertura.json
